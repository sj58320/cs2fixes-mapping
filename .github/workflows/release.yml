name: Build and release executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch annotated tag
        run: git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build executables
        run: |
          pyinstaller --onefile --name setup setup.py
          pyinstaller --onefile --uac-admin --name run-mapping run-mapping.py

      - name: Write checksums
        shell: pwsh
        run: |
          Get-FileHash dist/setup.exe, dist/run-mapping.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/setup.exe dist/run-mapping.exe dist/SHA256SUMS.txt `
            --title "$env:GITHUB_REF_NAME" --notes-from-tag
